[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "golden-gate"
version = "0.1.0"
description = "Exposes Wi-Fi-AP and Bluetooth devices on the lab LAN through adapters"
requires-python = ">=3.13"
license = { text = "UNLICENSED" }
dependencies = [
  "aiohttp>=3.10,<4",
  "pillow>=11,<13",
]

[project.optional-dependencies]
ble = ["bleak>=0.22,<2"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.setuptools.packages.find]
include = ["golden_gate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
